
name: Deploy React Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: react-erp-app
        run: npm ci

      - name: Build React Frontend
        working-directory: react-erp-app
        run: npm run build

      - name: Prepare Frontend Upload
        run: |
          mkdir -p upload
          cp -r react-erp-app/dist upload/dist

      - name: Upload Frontend to Public Folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public/
          local-dir: ./upload/
